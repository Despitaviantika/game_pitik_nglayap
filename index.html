<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitik Nglayap</title>
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #0b0b10;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            box-sizing: border-box;
        }

        #gameContainer {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #FFB300;
        }

        /* Container Logo di Bawah Judul */
        .logo-header {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 12px;
        }

        /* Ukuran Logo Diperkecil (30px) */
        .logo-header img {
            height: 30px;
            width: auto;
            border-radius: 4px;
        }

        canvas {
            border-radius: 12px;
            border: 3px solid #333;
            display: block;
            background-color: #4a90e2;
        }

        .info-panel {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <h1>🐔 PITIK NGLAYAP</h1>

    <div class="logo-header">
        <img src="formek.jpeg" alt="Logo 1">
        <img src="pkmoko.jpeg" alt="Logo 2">
        <img src="smk.jpeg" alt="Logo 3">
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="info-panel">
        🎮 <strong>Kontrol:</strong> Tekan <strong>SPASI</strong> atau <strong>TAP LAYAR</strong> untuk melompat.
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let score = 0;
    let level = 1;
    let gameOver = false;

    const pitik = {
        x: 100,
        y: 310,
        width: 35,
        height: 35,
        velocityY: 0,
        gravity: 0.6,
        jumpStrength: -12,
        isJumping: false
    };

    const obstacle = {
        x: 800,
        y: 310,
        width: 30,
        height: 40,
        speed: 6
    };

    function lompat() {
        if (!pitik.isJumping && !gameOver) {
            pitik.velocityY = pitik.jumpStrength;
            pitik.isJumping = true;
        } else if (gameOver) {
            resetGame();
        }
    }

    window.addEventListener("keydown", function(e) {
        if (e.code === "Space") {
            e.preventDefault();
            lompat();
        }
    });

    canvas.addEventListener("touchstart", function(e) {
        e.preventDefault();
        lompat();
    });

    function resetGame() {
        gameOver = false;
        score = 0;
        level = 1;
        obstacle.speed = 6;
        obstacle.x = canvas.width;
        pitik.y = 310;
        pitik.velocityY = 0;
        loop();
    }

    function update() {
        if (gameOver) return;

        pitik.velocityY += pitik.gravity;
        pitik.y += pitik.velocityY;

        if (pitik.y >= 310) {
            pitik.y = 310;
            pitik.isJumping = false;
        }

        obstacle.x -= obstacle.speed;
        if (obstacle.x < -obstacle.width) {
            obstacle.x = canvas.width;
            score += 10;
            if (score >= 50) obstacle.speed = 8;
            if (score >= 100) obstacle.speed = 10;
        }

        // Cek Tabrakan
        if (
            pitik.x < obstacle.x + obstacle.width &&
            pitik.x + pitik.width > obstacle.x &&
            pitik.y < obstacle.y + obstacle.height &&
            pitik.y + pitik.height > obstacle.y
        ) {
            gameOver = true;
        }
    }

    function draw() {
        // Background Langit
        ctx.fillStyle = "#4a90e2";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Tanah / Rumput
        ctx.fillStyle = "#2e7d32";
        ctx.fillRect(0, 345, canvas.width, 55);

        // Karakter Pitik (Ayam Kuning Ringkas)
        ctx.fillStyle = "#FFC107";
        ctx.beginPath();
        ctx.arc(pitik.x + 18, pitik.y + 18, 18, 0, Math.PI * 2);
        ctx.fill();

        // Paruh
        ctx.fillStyle = "#FF5722";
        ctx.beginPath();
        ctx.moveTo(pitik.x + 30, pitik.y + 12);
        ctx.lineTo(pitik.x + 40, pitik.y + 18);
        ctx.lineTo(pitik.x + 30, pitik.y + 24);
        ctx.closePath();
        ctx.fill();

        // Mata
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(pitik.x + 24, pitik.y + 12, 3, 0, Math.PI * 2);
        ctx.fill();

        // Rintangan (Batu)
        ctx.fillStyle = "#607D8B";
        ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

        // Teks Skor
        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 18px Arial";
        ctx.fillText("🌾 Skor: " + score, 20, 35);

        // Layar Game Over
        if (gameOver) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#FF1744";
            ctx.font = "bold 32px Arial";
            ctx.textAlign = "center";
            ctx.fillText("PITIK NABRAK!", canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "16px Arial";
            ctx.fillText("Tekan SPASI atau TAP untuk Baleni", canvas.width / 2, canvas.height / 2 + 30);
            ctx.textAlign = "left";
        }
    }

    function loop() {
        update();
        draw();
        if (!gameOver) {
            requestAnimationFrame(loop);
        }
    }

    loop();
</script>

</body>
</html>
