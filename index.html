<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitik Nglayap - Canva Cinematic Edition</title>
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #0b0b10;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            box-sizing: border-box;
        }

        #gameContainer {
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            background: linear-gradient(45deg, #FFB300, #FF3D00, #E040FB);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Container Logo Header (Di Bawah Judul) */
        .logo-header {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; /* Jarak antar logo diperkecil */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            padding: 6px 18px; /* Padding diperkecil agar lebih ringkas */
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .logo-header img {
            height: 32px; /* Ukuran tinggi logo diperkecil dari 50px ke 32px */
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo-header img:hover {
            transform: scale(1.1);
            filter: drop-shadow(0px 4px 8px rgba(255, 255, 255, 0.3));
        }

        canvas {
            border-radius: 16px;
            border: 5px solid #2d2d35;
            box-shadow: 0px 25px 50px rgba(0,0,0,0.9);
            display: block;
        }

        .info-panel {
            margin-top: 15px;
            font-size: 14px;
            color: #b0b0bc;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(5px);
            padding: 10px 25px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <h1>🐔 PITIK NGLAYAP</h1>

    <div class="logo-header">

        <img src="pkmoko.jpeg" alt="MOKO Logo" title="MOKO Game Development Projects">
        <img src="smk.jpeg" alt="SMKN 1 Sanden Logo" title="SMKN 1 Sanden Bantul">
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="info-panel">
        🎮 <strong>Kontrol:</strong> Tekan Tombol <strong>SPASI</strong> atau <strong>TAP LAYAR</strong> untuk melompat.
    </div>
</div>
