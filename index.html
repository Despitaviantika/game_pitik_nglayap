<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitik Nglayap</title>
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            background-color: #0b0b10;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            box-sizing: border-box;
        }

        #gameContainer {
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #FFB300, #FF3D00, #E040FB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-header {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-header img {
            height: 30px;
            width: auto;
            object-fit: contain;
            border-radius: 4px;
        }

        canvas {
            border-radius: 16px;
            border: 4px solid #2d2d35;
            box-shadow: 0px 20px 40px rgba(0,0,0,0.8);
            display: block;
            background-color: #4a90e2;
        }

        .info-panel {
            margin-top: 15px;
            font-size: 14px;
            color: #b0b0bc;
            background: rgba(255, 255, 255, 0.07);
            padding: 8px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <h1>🐔 PITIK NGLAYAP</h1>

    <div class="logo-header">
        <img src="formek.jpeg" alt="Fortune IV Logo">
        <img src="pkmoko.jpeg" alt="MOKO Logo">
        <img src="smk.jpeg" alt="SMKN 1 Sanden Logo">
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="info-panel">
        🎮 <strong>Kontrol:</strong> Tekan Tombol <strong>SPASI</strong> atau <strong>TAP LAYAR</strong> untuk melompat.
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const themes = {
        1: { skyTop: "#4a90e2", skyBottom: "#b2ebf2", hillBack: "#2e7d32", hillFront: "#388e3c", ground: "#1b5e20", rock: "#78909c" },
        2: { skyTop: "#e65100", skyBottom: "#ffb74d", hillBack: "#bf360c", hillFront: "#d84315", ground: "#8d6e63", rock: "#5d4037" },
        3: { skyTop: "#0a1128", skyBottom: "#1c2541", hillBack: "#0b2510", hillFront: "#143619", ground: "#0b1d12", rock: "#37474f" },
        4: { skyTop: "#2d004d", skyBottom: "#d500f9", hillBack: "#4a0072", hillFront: "#7b1fa2", ground: "#1a0033", rock: "#120024" }
    };

    const pitik = { x: 120, y: 310, width: 40, height: 40, velocityY: 0, gravity: 0.6, jumpStrength: -12, isJumping: false };
    const obstacle = { x: 800, y: 300, width: 35, height: 50, speed: 7 };

    let score = 0;
    let level = 1;
    let gameOver = false;

    window.addEventListener("keydown", function(e) {
        if (e.code === "Space") {
            e.preventDefault();
            lompat();
        }
    });

    canvas.addEventListener("touchstart", function(e) {
        e.preventDefault();
        lompat();
    });

    function lompat() {
        if (!pitik.isJumping && !gameOver) {
            pitik.velocityY = pitik.jumpStrength;
            pitik.isJumping = true;
        }
        if (gameOver) {
            resetGame();
        }
    }

    function resetGame() {
        gameOver = false;
        score = 0;
        level = 1;
        obstacle.speed = 7;
        obstacle.x = canvas.width;
        pitik.y = 310;
        pitik.velocityY = 0;
        update();
    }

    function drawPitik() {
        ctx.save();
        ctx.translate(pitik.x, pitik.y);
        
        ctx.fillStyle = "#FF9800";
        ctx.beginPath();
        ctx.arc(20, 20, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#E53935";
        ctx.beginPath();
        ctx.arc(14, 2, 5, 0, Math.PI * 2);
        ctx.arc(22, 0, 7, 0, Math.PI * 2);
        ctx.arc(28, 3, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#FFEB3B";
        ctx.beginPath();
        ctx.moveTo(34, 16);
        ctx.lineTo(44, 20);
        ctx.lineTo(34, 24);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.arc(26, 14, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(28, 14, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#F57C00";
        ctx.beginPath();
        ctx.ellipse(10, 22, 10, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawObstacle(theme) {
        ctx.fillStyle = theme.rock;
        ctx.beginPath();
        ctx.moveTo(obstacle.x + 10, obstacle.y);
        ctx.lineTo(obstacle.x + obstacle.width - 5, obstacle.y + 10);
        ctx.lineTo(obstacle.x + obstacle.width, obstacle.y + obstacle.height);
        ctx.lineTo(obstacle.x, obstacle.y + obstacle.height);
        ctx.closePath();
        ctx.fill();
    }

    function update() {
        const theme = themes[level] || themes[4];

        if (gameOver) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#FF1744";
            ctx.font = "bold 36px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("PITIK NABRAK!", canvas.width / 2, canvas.height / 2 - 10);
            
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "16px sans-serif";
            ctx.fillText("Tekan SPASI atau TAP untuk Baleni (Mulai Ulang)", canvas.width / 2, canvas.height / 2 + 30);
            return;
        }

        pitik.velocityY += pitik.gravity;
        pitik.y += pitik.velocityY;

        if (pitik.y >= 310) {
            pitik.y = 310;
            pitik.isJumping = false;
        }

        obstacle.x -= obstacle.speed;
        if (obstacle.x < -obstacle.width) {
            obstacle.x = canvas.width;
            score += 10;
            if (score >= 50 && level === 1) { level = 2; obstacle.speed = 9; }
            else if (score >= 100 && level === 2) { level = 3; obstacle.speed = 11; }
            else if (score >= 150 && level === 3) { level = 4; obstacle.speed = 13; }
        }

        if (
            pitik.x < obstacle.x + obstacle.width &&
            pitik.x + pitik.width > obstacle.x &&
            pitik.y < obstacle.y + obstacle.height &&
            pitik.y + pitik.height > obstacle.y
        ) {
            gameOver = true;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, theme.skyTop);
        grad.addColorStop(1, theme.skyBottom);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = theme.hillBack;
        ctx.beginPath();
        ctx.arc(200, 450, 250, 0, Math.PI * 2);
        ctx.arc(600, 450, 300, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = theme.hillFront;
        ctx.beginPath();
        ctx.arc(400, 480, 280, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = theme.ground;
        ctx.fillRect(0, 350, canvas.width, 50);

        drawObstacle(theme);
        drawPitik();

        ctx.fillStyle = "#FFFFFF";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("🌾 Skor: " + score, 25, 35);
        ctx.fillText("⭐ Level: " + level, 25, 60);

        requestAnimationFrame(update);
    }

    update();
</script>

</body>
</html>
