<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitik Nglayap - Premium Version</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        #gameContainer {
            position: relative;
            text-align: center;
        }

        h1 {
            margin: 5px 0 15px 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #FFA500, #FF4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        canvas {
            border-radius: 12px;
            border: 4px solid #444;
            box-shadow: 0px 20px 40px rgba(0,0,0,0.8);
            display: block;
        }

        .info-panel {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <h1>🐔 Pitik Nglayap</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="info-panel">
        🎮 <strong>Kontrol:</strong> Tekan Tombol <strong>SPASI</strong> atau <strong>TAP LAYAR</strong> untuk melompat.
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Tema per level
    const themes = {
        1: { // Pagi Ceria
            skyTop: "#3a7bd5",
            skyBottom: "#3a6073",
            ground: "#2e7d32",
            groundLine: "#1b5e20",
            rockColor: "#7f8c8d",
            rockShadow: "#95a5a6",
            hasStars: false
        },
        2: { // Sore Senja
            skyTop: "#e65c00",
            skyBottom: "#F9D423",
            ground: "#d84315",
            groundLine: "#bf360c",
            rockColor: "#8d6e63",
            rockShadow: "#a1887f",
            hasStars: false
        },
        3: { // Malam Berbintang
            skyTop: "#0f2027",
            skyBottom: "#203a43",
            ground: "#1b5e20",
            groundLine: "#0d230d",
            rockColor: "#34495e",
            rockShadow: "#5d6d7e",
            hasStars: true
        },
        4: { // Dimensi Neon/Mistis
            skyTop: "#41295a",
            skyBottom: "#2F0743",
            ground: "#4a148c",
            groundLine: "#311b92",
            rockColor: "#111",
            rockShadow: "#00e5ff", // glow neon
            hasStars: true
        }
    };

    // Konfigurasi Karakter Pitik
    const pitik = {
        x: 100,
        y: 310,
        width: 44,
        height: 44,
        velocityY: 0,
        gravity: 0.6,
        jumpStrength: -12.5,
        isJumping: false,
        wingAngle: 0
    };

    // Konfigurasi Rintangan Batu
    const obstacle = {
        x: 800,
        y: 295,
        width: 35,
        height: 55,
        speed: 7
    };

    // Variabel Game
    let score = 0;
    let level = 1;
    let gameOver = false;
    let stars = [];

    // Membuat bintang acak untuk malam hari
    for (let i = 0; i < 40; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * 200,
            size: Math.random() * 2,
            alpha: Math.random()
        });
    }

    // Input Handlers
    window.addEventListener("keydown", function(e) {
        if (e.code === "Space") {
            e.preventDefault();
            lompat();
        }
    });

    canvas.addEventListener("touchstart", function(e) {
        e.preventDefault();
        lompat();
    });

    function lompat() {
        if (!pitik.isJumping && !gameOver) {
            pitik.velocityY = pitik.jumpStrength;
            pitik.isJumping = true;
        }
        if (gameOver) {
            resetGame();
        }
    }

    function resetGame() {
        gameOver = false;
        score = 0;
        level = 1;
        obstacle.speed = 7;
        obstacle.x = canvas.width;
        pitik.y = 310;
        pitik.velocityY = 0;
        update();
    }

    // Menggambar Pitik
    function drawPitik() {
        ctx.save();
        ctx.translate(pitik.x, pitik.y);

        // Tubuh utama
        ctx.fillStyle = "#FF9800";
        ctx.beginPath();
        ctx.arc(22, 22, 20, 0, Math.PI * 2);
        ctx.fill();

        // Jengger (Comb)
        ctx.fillStyle = "#E53935";
        ctx.beginPath();
        ctx.arc(15, -2, 7, 0, Math.PI * 2);
        ctx.arc(25, -5, 8, 0, Math.PI * 2);
        ctx.arc(35, -1, 6, 0, Math.PI * 2);
        ctx.fill();

        // Paruh
        ctx.fillStyle = "#FFEB3B";
        ctx.beginPath();
        ctx.moveTo(38, 16);
        ctx.lineTo(48, 22);
        ctx.lineTo(38, 26);
        ctx.closePath();
        ctx.fill();

        // Mata Besar
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.arc(28, 14, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(30, 14, 3, 0, Math.PI * 2);
        ctx.fill();

        // Sayap (Mengepak pelan ketika lompat)
        if (pitik.isJumping) {
            pitik.wingAngle = Math.sin(Date.now() * 0.05) * 10;
        } else {
            pitik.wingAngle = 0;
        }
        ctx.save();
        ctx.translate(10, 24);
        ctx.rotate((pitik.wingAngle * Math.PI) / 180);
        ctx.fillStyle = "#F57C00";
        ctx.beginPath();
        ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Kaki kuning
        ctx.strokeStyle = "#FFEB3B";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(15, 38);
        ctx.lineTo(15, 44);
        ctx.moveTo(25, 38);
        ctx.lineTo(25, 44);
        ctx.stroke();

        ctx.restore();
    }

    // Menggambar Rintangan Batu Estetik
    function drawObstacle(theme) {
        ctx.save();
        ctx.fillStyle = theme.rockColor;
        
        // Buat batu berongga/tidak beraturan agar lebih alami
        ctx.beginPath();
        ctx.moveTo(obstacle.x + obstacle.width * 0.2, obstacle.y);
        ctx.lineTo(obstacle.x + obstacle.width * 0.8, obstacle.y + 5);
        ctx.lineTo(obstacle.x + obstacle.width, obstacle.y + obstacle.height * 0.5);
        ctx.lineTo(obstacle.x + obstacle.width * 0.9, obstacle.y + obstacle.height);
        ctx.lineTo(obstacle.x + obstacle.width * 0.1, obstacle.y + obstacle.height);
        ctx.lineTo(obstacle.x, obstacle.y + obstacle.height * 0.4);
        ctx.closePath();
        ctx.fill();

        // Highlight/Shadow di Batu
        ctx.strokeStyle = theme.rockShadow;
        ctx.lineWidth = 2.5;
        if (level === 4) {
            // Efek neon glow di level 4
            ctx.shadowBlur = 10;
            ctx.shadowColor = theme.rockShadow;
        }
        ctx.stroke();

        // Garis retakan alami di dalam batu
        ctx.beginPath();
        ctx.moveTo(obstacle.x + obstacle.width * 0.4, obstacle.y + 10);
        ctx.lineTo(obstacle.x + obstacle.width * 0.5, obstacle.y + obstacle.height * 0.6);
        ctx.lineTo(obstacle.x + obstacle.width * 0.3, obstacle.y + obstacle.height * 0.8);
        ctx.strokeStyle = "rgba(0,0,0,0.2)";
        ctx.stroke();

        ctx.restore();
    }

    // Loop Game Utama
    function update() {
        const currentTheme = themes[level] || themes[4];

        if (gameOver) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#FF0000";
            ctx.fillStyle = "#FF3333";
            ctx.font = "bold 36px Arial";
            ctx.textAlign = "center";
            ctx.fillText("PITIK NABRAK!", canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "20px Arial";
            ctx.fillText("Tekan SPASI atau TAP untuk Baleni", canvas.width / 2, canvas.height / 2 + 30);
            return;
        }

        // --- 1. LOGIKA FISIKA & PERGERAKAN ---
        pitik.velocityY += pitik.gravity;
        pitik.y += pitik.velocityY;

        if (pitik.y >= 310) {
            pitik.y = 310;
            pitik.isJumping = false;
        }

        obstacle.x -= obstacle.speed;

        if (obstacle.x < -obstacle.width) {
            obstacle.x = canvas.width;
            score += 10;

            // Sistem Naik Level
            if (score >= 50 && level === 1) { level = 2; obstacle.speed = 9; }
            else if (score >= 100 && level === 2) { level = 3; obstacle.speed = 11; }
            else if (score >= 150 && level === 3) { level = 4; obstacle.speed = 14; }
        }

        // --- 2. DETEKSI TABRAKAN ---
        if (
            pitik.x < obstacle.x + obstacle.width &&
            pitik.x + pitik.width > obstacle.x &&
            pitik.y < obstacle.y + obstacle.height &&
            pitik.y + pitik.height > obstacle.y
        ) {
            gameOver = true;
        }

        // --- 3. PROSES GAMBAR (RENDER VISUAL) ---
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Gambar Gradasi Langit Estetik
        let skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGradient.addColorStop(0, currentTheme.skyTop);
        skyGradient.addColorStop(1, currentTheme.skyBottom);
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Efek Bintang berkelip di Malam Hari/Angkasa
        if (currentTheme.hasStars) {
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
                // Membuat kedipan halus
                star.alpha += (Math.random() - 0.5) * 0.1;
                if (star.alpha < 0.1) star.alpha = 0.1;
                if (star.alpha > 1) star.alpha = 1;
            });
        }

        // Gambar Tanah (dengan garis pembatas rumput lembut)
        ctx.fillStyle = currentTheme.ground;
        ctx.fillRect(0, 350, canvas.width, 50);
        ctx.fillStyle = currentTheme.groundLine;
        ctx.fillRect(0, 350, canvas.width, 4);

        // Gambar Aset Game
        drawPitik();
        drawObstacle(currentTheme);

        // UI Teks Bergaya Modern
        ctx.save();
        ctx.fillStyle = "#FFFFFF";
        ctx.shadowBlur = 4;
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "left";
        ctx.fillText("🌾 Gabah (Skor): " + score, 25, 40);
        ctx.fillText("⭐ Level: " + level, 25, 70);
        ctx.restore();

        requestAnimationFrame(update);
    }

    update();
</script>

</body>
</html>
